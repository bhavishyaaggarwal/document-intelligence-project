services:
  - type: web
    name: document-intelligence-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: document-intelligence-db
          property: connectionString
      - key: EXTRACTION_PROVIDER
        value: gemini
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: document-intelligence-db
    plan: free
    region: singapore
    databaseName: document_intelligence
    user: document_intelligence
